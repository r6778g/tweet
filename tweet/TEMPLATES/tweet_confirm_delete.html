{% extends "layout.html" %}

{% block title %}Default Title{% endblock %}

{% block content %}
<h1>Are you sure you want to delete this tweet?</h1>
<p>{{ tweet.content }}</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'tweet_list' %}">Cancel</a>
</form>

{% endblock %}
